name: dhisme_pos
version: 1.0.0+1
publish_to: 'none'
description: Owner-controlled construction materials POS and inventory app.

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.0
  intl: ^0.20.2
  uuid: ^4.5.1
  flutter_riverpod: ^2.6.1
  go_router: ^16.0.0
  pdf: ^3.11.3
  printing: ^5.14.2
  shared_preferences: ^2.5.3
  connectivity_plus: ^6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.5

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/app_icon.png
  adaptive_icon_foreground: assets/icon/app_icon.png
  adaptive_icon_background: "#FFFFFF"

flutter_native_splash:
  color: "#0B1F3A"
  image: assets/icon/app_icon.png
  android: true
  ios: false
  android_12:
    color: "#0B1F3A"
    icon_background_color: "#0B1F3A"
    image: assets/icon/app_icon.png
