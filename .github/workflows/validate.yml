name: Validate Dukaan Dhisme POS

on:
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Analyze code
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee analyze.log

      - name: Run automated tests
        shell: bash
        run: |
          set -o pipefail
          flutter test --coverage 2>&1 | tee test.log

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-validation-diagnostics
          path: |
            analyze.log
            test.log
            coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 7
