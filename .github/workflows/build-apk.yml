name: Build Dhisme POS Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" || true

      - name: Create Android project files if missing
        run: |
          if [ ! -d "android" ]; then
            flutter create . --project-name dhisme_pos --platforms=android
          fi

      - name: Show Flutter doctor
        run: flutter doctor -v

      - name: Get packages
        run: flutter pub get

      - name: Force compileSdk 36 for Android app and plugins
        run: |
          set -e
          echo "Patching generated Android app Gradle files to compileSdk 36..."
          if [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/g' android/app/build.gradle
            sed -i 's/compileSdk [0-9][0-9]*/compileSdk 36/g' android/app/build.gradle
            sed -i 's/compileSdkVersion [0-9][0-9]*/compileSdkVersion 36/g' android/app/build.gradle
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle.kts
            sed -i 's/compileSdk = [0-9][0-9]*/compileSdk = 36/g' android/app/build.gradle.kts
          fi

          echo "Patching Flutter plugin Gradle files to compileSdk 36..."
          find "$HOME/.pub-cache/hosted/pub.dev" -path "*/android/build.gradle" -type f -print0 | while IFS= read -r -d '' file; do
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/g' "$file"
            sed -i 's/compileSdkVersion [0-9][0-9]*/compileSdkVersion 36/g' "$file"
            sed -i 's/compileSdk [0-9][0-9]*/compileSdk 36/g' "$file"
          done
          find "$HOME/.pub-cache/hosted/pub.dev" -path "*/android/build.gradle.kts" -type f -print0 | while IFS= read -r -d '' file; do
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' "$file"
            sed -i 's/compileSdk = [0-9][0-9]*/compileSdk = 36/g' "$file"
          done

      - name: Generate splash screen
        run: dart run flutter_native_splash:create

      - name: Generate app icon
        run: dart run flutter_launcher_icons

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dhisme-pos-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
