name: Build Dukaan Dhisme POS Validation APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: apk-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-validation-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_OPTS: -Dorg.gradle.vfs.watch=false
      ORG_GRADLE_PROJECT_validationBuild: "true"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Reject privileged Supabase keys in client builds
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::SUPABASE_ANON_KEY is missing."
            exit 1
          fi
          case "$SUPABASE_ANON_KEY" in
            sb_publishable_*)
              ;;
            sb_secret_*)
              echo "::error::SUPABASE_ANON_KEY contains a privileged sb_secret_ key. Mobile builds must use a publishable key or legacy anon key."
              exit 1
              ;;
            eyJ*)
              python - <<'PY'
          import base64, json, os, sys
          key = os.environ["SUPABASE_ANON_KEY"]
          try:
              payload = key.split(".")[1]
              payload += "=" * (-len(payload) % 4)
              role = json.loads(base64.urlsafe_b64decode(payload).decode()).get("role")
          except Exception:
              print("::error::SUPABASE_ANON_KEY is not a valid legacy JWT.", file=sys.stderr)
              sys.exit(1)
          if role != "anon":
              print("::error::Legacy Supabase client JWT must have role=anon; privileged service-role keys are forbidden.", file=sys.stderr)
              sys.exit(1)
          PY
              ;;
            *)
              echo "::error::SUPABASE_ANON_KEY must be an sb_publishable_ key or a legacy anon JWT."
              exit 1
              ;;
          esac

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          cache: true

      - name: Verify committed Android project
        run: |
          set -euo pipefail
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.jar

      - name: Install Android SDK 36
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          set +o pipefail
          yes | "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0"
          set -o pipefail

      - name: Get packages
        run: flutter pub get

      - name: Generate splash and app icon
        run: |
          dart run flutter_native_splash:create
          dart run flutter_launcher_icons

      - name: Analyze code
        run: flutter analyze --fatal-infos

      - name: Run automated tests
        run: flutter test --coverage

      - name: Build non-production validation APK
        run: |
          set -euo pipefail
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
          cat > build/app/outputs/flutter-apk/BUILD_CHANNEL.txt <<'EOF'
          NON-PRODUCTION VALIDATION BUILD
          RELEASE MODE / DEBUG SIGNING
          NOT FOR PRODUCTION DISTRIBUTION
          EOF
          sha256sum build/app/outputs/flutter-apk/app-release.apk \
            > build/app/outputs/flutter-apk/SHA256SUMS

      - name: Upload validation artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: dukaan-dhisme-pos-validation-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/BUILD_CHANNEL.txt
            build/app/outputs/flutter-apk/SHA256SUMS
          retention-days: 1
