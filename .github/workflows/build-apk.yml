name: Build Dukaan Dhisme POS Validation APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: apk-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-validation-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_OPTS: -Dorg.gradle.vfs.watch=false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          cache: true

      - name: Install Android SDK 36
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          # sdkmanager closes stdin after accepting licenses. Disable pipefail only
          # for this pipeline so the normal SIGPIPE from `yes` is not a failure;
          # the pipeline still returns sdkmanager's own exit status.
          set +o pipefail
          yes | "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0"
          set -o pipefail

      - name: Create Android project files if missing
        run: |
          set -euo pipefail
          if [ ! -d "android" ]; then
            TEMP_PROJECT="$(mktemp -d)"
            flutter create "$TEMP_PROJECT" \
              --project-name dhisme_pos \
              --org com.dukaandhisme \
              --platforms=android
            mv "$TEMP_PROJECT/android" ./android
            rm -rf "$TEMP_PROJECT"
          fi

      - name: Configure Android manifest
        run: |
          set -euo pipefail
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
          fi
          if ! grep -q "android.permission.ACCESS_NETWORK_STATE" "$MANIFEST"; then
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' "$MANIFEST"
          fi
          sed -i 's/android:label="[^"]*"/android:label="Dukaan Dhisme POS"/g' "$MANIFEST"

      - name: Configure compileSdk 36
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/force-android-compile-sdk.gradle" <<'EOF'
          gradle.projectsEvaluated {
              rootProject.allprojects { project ->
                  def androidExt = project.extensions.findByName("android")
                  if (androidExt != null) {
                      try { androidExt.compileSdk = 36 } catch (Throwable ignored) {}
                      try { androidExt.compileSdkVersion 36 } catch (Throwable ignored) {}
                  }
              }
          }
          EOF
          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties

      - name: Get packages
        run: flutter pub get

      - name: Generate splash and app icon
        run: |
          dart run flutter_native_splash:create
          dart run flutter_launcher_icons

      - name: Analyze code
        run: flutter analyze --fatal-infos

      - name: Run automated tests
        run: flutter test --coverage

      - name: Build unsigned validation APK
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          echo "UNSIGNED VALIDATION BUILD - NOT FOR PRODUCTION DISTRIBUTION" \
            > build/app/outputs/flutter-apk/BUILD_CHANNEL.txt

      - name: Upload validation artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: dukaan-dhisme-pos-unsigned-validation-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/BUILD_CHANNEL.txt
          retention-days: 1
