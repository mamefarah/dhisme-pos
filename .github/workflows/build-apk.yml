name: Build Dhisme POS Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.vfs.watch=false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" || true

      - name: Create Android project files if missing
        run: |
          if [ ! -d "android" ]; then
            flutter create . --project-name dhisme_pos --platforms=android
          fi

      - name: Show Flutter doctor
        run: flutter doctor -v

      - name: Get packages
        run: flutter pub get

      - name: Force compileSdk 36 for all Android Gradle subprojects
        run: |
          set -e
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/force-android-compile-sdk.gradle" <<'EOF'
          gradle.projectsEvaluated {
              rootProject.allprojects { project ->
                  def androidExt = project.extensions.findByName("android")
                  if (androidExt != null) {
                      try {
                          androidExt.compileSdk = 36
                      } catch (Throwable ignored) {
                          // Some Android Gradle Plugin versions expose only compileSdkVersion().
                      }
                      try {
                          androidExt.compileSdkVersion 36
                      } catch (Throwable ignored) {
                          // Some Android Gradle Plugin versions expose only compileSdk property.
                      }
                      println("Forced compileSdk 36 for ${project.path}")
                  }
              }
          }
          EOF

          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties

          echo "Patching generated Android app Gradle files to compileSdk 36..."
          if [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/g' android/app/build.gradle
            sed -i 's/compileSdk [0-9][0-9]*/compileSdk 36/g' android/app/build.gradle
            sed -i 's/compileSdkVersion [0-9][0-9]*/compileSdkVersion 36/g' android/app/build.gradle
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle.kts
            sed -i 's/compileSdk = [0-9][0-9]*/compileSdk = 36/g' android/app/build.gradle.kts
          fi

      - name: Generate splash screen
        run: dart run flutter_native_splash:create

      - name: Generate app icon
        run: dart run flutter_launcher_icons

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dhisme-pos-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
