name: Build Dhisme POS Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project files if missing
        run: |
          if [ ! -d "android" ]; then
            flutter create . --project-name dhisme_pos --platforms=android
          fi

      - name: Show Flutter doctor
        run: flutter doctor -v

      - name: Get packages
        run: flutter pub get

      - name: Generate splash screen
        run: dart run flutter_native_splash:create

      - name: Generate app icon
        run: dart run flutter_launcher_icons

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dhisme-pos-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
