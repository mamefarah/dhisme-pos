name: Validate Supabase Database

on:
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}

      - name: Initialize isolated local Supabase config
        run: supabase init --force

      - name: Rebuild database from committed migrations
        run: supabase db start

      - name: Run database security and RLS tests
        run: supabase test db --local

      - name: Exercise encrypted backup and integrity verification
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env | grep '^DB_URL=')"
          test -n "${DB_URL:-}"

          export SUPABASE_DB_URL="$DB_URL"
          export BACKUP_ENCRYPTION_PASSPHRASE="ci-only-backup-roundtrip-secret"
          export BACKUP_DIR="$RUNNER_TEMP/dhisme-backup-test"

          bash scripts/backup_supabase.sh
          BACKUP_FILE="$(find "$BACKUP_DIR" -maxdepth 1 -name '*.tar.gz.enc' -type f | head -n 1)"
          test -n "$BACKUP_FILE"
          bash scripts/verify_supabase_backup.sh "$BACKUP_FILE"
