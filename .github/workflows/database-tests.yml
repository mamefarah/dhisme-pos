name: Validate Supabase Database

on:
  pull_request:
    branches:
      - main
      - master
    paths:
      - "supabase/**"
      - "scripts/ci_restore_drill.sh"
      - "scripts/restore_drill_fixture.sql"
      - "scripts/backup_supabase.sh"
      - "scripts/verify_supabase_backup.sh"
      - ".github/workflows/database-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}

      - name: Initialize isolated local Supabase config
        run: supabase init --force

      - name: Rebuild database from committed migrations
        run: supabase db start

      - name: Run database security and RLS tests
        run: supabase test db --local

      - name: Exercise encrypted backup, clean restore, and post-restore validation
        shell: bash
        run: bash scripts/ci_restore_drill.sh
