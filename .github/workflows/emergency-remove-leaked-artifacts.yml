name: Emergency Remove Leaked Validation Artifacts

on:
  push:
    branches:
      - security/contain-supabase-key-leak
    paths:
      - .github/workflows/emergency-remove-leaked-artifacts.yml

permissions:
  contents: read
  actions: write

jobs:
  remove-leaked-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Delete known validation APK artifacts containing privileged Supabase key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for artifact_id in 10615184871 10616208467 10617470709; do
            echo "Deleting artifact $artifact_id"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" || true
          done
